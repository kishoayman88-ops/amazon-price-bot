name: Amazon price watch

# The scan job runs for ~5h45m and checks every minute.
# The hourly schedule queues the next job, so it restarts right away when one ends.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Only send a test Telegram message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ inputs.test_alert && 'price-bot-test' || 'price-bot' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"

      - name: Check prices
        run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ONLY: ${{ inputs.test_alert }}
          DROP_PERCENT: "50"
          RUN_MINUTES: "345"
          FAST_EVERY: "1"
          SLOW_EVERY: "30"

      - name: Save prices
        if: always()
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "Update prices"
          git pull --rebase
          git push
